name: Security and build verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: themes/earth
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          standalone: false
          package_json_file: themes/earth/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: themes/earth/.nvmrc
          cache: pnpm
          cache-dependency-path: themes/earth/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Unreleased upstream fixes are documented in SECURITY.md.
      - run: pnpm audit --ignore GHSA-vfj7-8cjw-p6xm
      - run: pnpm build
      - run: pnpm check
      - run: pnpm exec vsce package --no-dependencies --out /tmp/earth-security-check.vsix
